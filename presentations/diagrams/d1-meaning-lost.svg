<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#FFFAF2"/>
  <rect x="300" y="36" width="600" height="110" rx="6" fill="#0A1628"/>
  <text x="600" y="82" text-anchor="middle" fill="#C5DDE4" font-size="15" letter-spacing="3">ONE SENTENCE, ONE MEANING</text>
  <text x="600" y="116" text-anchor="middle" fill="#FFFAF2" font-size="24" font-weight="600">“Terms shall be defined before use.”</text>
  <g font-size="17" font-weight="600" text-anchor="middle">
    <rect x="60"  y="220" width="200" height="64" rx="6" fill="#F3EBE0" stroke="#D4C9B5"/><text x="160"  y="258" fill="#0A1628">Markdown</text>
    <rect x="292" y="220" width="200" height="64" rx="6" fill="#F3EBE0" stroke="#D4C9B5"/><text x="392" y="258" fill="#0A1628">AsciiDoc</text>
    <rect x="524" y="220" width="200" height="64" rx="6" fill="#F3EBE0" stroke="#D4C9B5"/><text x="624" y="258" fill="#0A1628">reStructuredText</text>
    <rect x="756" y="220" width="200" height="64" rx="6" fill="#F3EBE0" stroke="#D4C9B5"/><text x="856" y="258" fill="#0A1628">Word / RTF</text>
    <rect x="988" y="220" width="160" height="64" rx="6" fill="#F3EBE0" stroke="#D4C9B5"/><text x="1068" y="258" fill="#0A1628">HTML</text>
  </g>
  <g stroke="#8A9AAB" stroke-width="2" fill="none" marker-end="url(#a)">
    <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8A9AAB"/></marker></defs>
    <line x1="160"  y1="146" x2="160"  y2="212"/>
    <line x1="392"  y1="146" x2="392"  y2="212"/>
    <line x1="624"  y1="146" x2="624"  y2="212"/>
    <line x1="856"  y1="146" x2="856"  y2="212"/>
    <line x1="1068" y1="146" x2="1068" y2="212"/>
  </g>
  <g stroke="#B85A2A" stroke-width="3" fill="none" stroke-dasharray="7 6" marker-end="url(#b)">
    <defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#B85A2A"/></marker></defs>
    <line x1="160"  y1="290" x2="360" y2="420"/>
    <line x1="392"  y1="290" x2="480" y2="420"/>
    <line x1="624"  y1="290" x2="620" y2="420"/>
    <line x1="856"  y1="290" x2="760" y2="420"/>
    <line x1="1068" y1="290" x2="840" y2="420"/>
  </g>
  <rect x="300" y="428" width="600" height="120" rx="6" fill="none" stroke="#B85A2A" stroke-width="3"/>
  <text x="600" y="472" text-anchor="middle" fill="#B85A2A" font-size="22" font-weight="700">SYSTEM-TO-SYSTEM EXCHANGE</text>
  <text x="600" y="506" text-anchor="middle" fill="#8F4219" font-size="17">degrades to plain text — emphasis, cross-references, terms,</text>
  <text x="600" y="530" text-anchor="middle" fill="#8F4219" font-size="17">notes, tables and change intent are lost on every hop</text>
  <text x="600" y="600" text-anchor="middle" fill="#8A9AAB" font-size="16">Every converter picks a different subset. There is no common thing being converted.</text>
</svg>
