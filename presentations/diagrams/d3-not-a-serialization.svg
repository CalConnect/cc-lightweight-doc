<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#FFFAF2"/>
  <text x="600" y="52" text-anchor="middle" fill="#2F6F82" font-size="15" letter-spacing="3">HTML AND RTF ARE SERIALIZATIONS — NOT THE SEMANTICS</text>
  <g font-size="16" text-anchor="middle" font-weight="600">
    <rect x="80"  y="120" width="220" height="70" rx="6" fill="#F3EBE0" stroke="#D4C9B5"/><text x="190" y="162" fill="#0A1628">Markdown / GFM</text>
    <rect x="80"  y="230" width="220" height="70" rx="6" fill="#F3EBE0" stroke="#D4C9B5"/><text x="190" y="272" fill="#0A1628">AsciiDoc</text>
    <rect x="80"  y="340" width="220" height="70" rx="6" fill="#F3EBE0" stroke="#D4C9B5"/><text x="190" y="382" fill="#0A1628">reStructuredText</text>
    <rect x="80"  y="450" width="220" height="70" rx="6" fill="#F3EBE0" stroke="#D4C9B5"/><text x="190" y="492" fill="#0A1628">Word / RTF</text>
  </g>
  <g stroke="#2F6F82" stroke-width="2.5" fill="none" marker-end="url(#in)">
    <defs><marker id="in" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2F6F82"/></marker></defs>
    <line x1="300" y1="155" x2="430" y2="290"/>
    <line x1="300" y1="265" x2="430" y2="306"/>
    <line x1="300" y1="375" x2="430" y2="322"/>
    <line x1="300" y1="485" x2="430" y2="338"/>
  </g>
  <rect x="440" y="240" width="320" height="150" rx="8" fill="#0A1628"/>
  <text x="600" y="296" text-anchor="middle" fill="#FFFAF2" font-size="26" font-weight="700">BasicDocument</text>
  <text x="600" y="326" text-anchor="middle" fill="#C5DDE4" font-size="16">the meaning: sections · blocks ·</text>
  <text x="600" y="350" text-anchor="middle" fill="#C5DDE4" font-size="16">inline · register · change</text>
  <g stroke="#B85A2A" stroke-width="2.5" fill="none" marker-end="url(#out)">
    <defs><marker id="out" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#B85A2A"/></marker></defs>
    <line x1="760" y1="290" x2="890" y2="155"/>
    <line x1="760" y1="306" x2="890" y2="265"/>
    <line x1="760" y1="322" x2="890" y2="375"/>
    <line x1="760" y1="338" x2="890" y2="485"/>
  </g>
  <g font-size="16" text-anchor="middle" font-weight="600">
    <rect x="900" y="120" width="220" height="70" rx="6" fill="none" stroke="#B85A2A" stroke-width="2"/><text x="1010" y="162" fill="#8F4219">HTML</text>
    <rect x="900" y="230" width="220" height="70" rx="6" fill="none" stroke="#B85A2A" stroke-width="2"/><text x="1010" y="272" fill="#8F4219">PDF</text>
    <rect x="900" y="340" width="220" height="70" rx="6" fill="none" stroke="#B85A2A" stroke-width="2"/><text x="1010" y="382" fill="#8F4219">Word / RTF</text>
    <rect x="900" y="450" width="220" height="70" rx="6" fill="none" stroke="#B85A2A" stroke-width="2"/><text x="1010" y="492" fill="#8F4219">XML / other</text>
  </g>
  <text x="190" y="580" text-anchor="middle" fill="#2F6F82" font-size="15" font-weight="700">PARSED IN, LOSSLESSLY</text>
  <text x="1010" y="580" text-anchor="middle" fill="#B85A2A" font-size="15" font-weight="700">RENDERED OUT, DETERMINISTICALLY</text>
  <text x="600" y="612" text-anchor="middle" fill="#243647" font-size="16">Your rich text keeps working: HTML/RTF remain what documents look like.</text>
</svg>
