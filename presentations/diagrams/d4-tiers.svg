<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#FFFAF2"/>
  <text x="600" y="50" text-anchor="middle" fill="#2F6F82" font-size="15" letter-spacing="3">THE MODEL IN ONE PICTURE</text>
  <g font-family="Courier New, monospace">
    <rect x="360" y="80"  width="480" height="86" rx="8" fill="#0A1628"/>
    <text x="600" y="118" text-anchor="middle" fill="#FFFAF2" font-size="22" font-weight="700">Document</text>
    <text x="600" y="146" text-anchor="middle" fill="#C5DDE4" font-size="14">identifier · bibdata (Relaton / ISO 690) · register</text>

    <rect x="360" y="196" width="480" height="86" rx="8" fill="#2F6F82"/>
    <text x="600" y="234" text-anchor="middle" fill="#FFFAF2" font-size="22" font-weight="700">Sections</text>
    <text x="600" y="262" text-anchor="middle" fill="#E3F0F4" font-size="14">hierarchical · prefatory · references — arbitrarily deep</text>

    <rect x="360" y="312" width="480" height="86" rx="8" fill="#B85A2A"/>
    <text x="600" y="350" text-anchor="middle" fill="#FFFAF2" font-size="22" font-weight="700">Blocks</text>
    <text x="600" y="378" text-anchor="middle" fill="#F9E4D7" font-size="14">paragraphs · tables · lists · figures · source · admonitions · amend</text>

    <rect x="360" y="428" width="480" height="86" rx="8" fill="#243647"/>
    <text x="600" y="466" text-anchor="middle" fill="#FFFAF2" font-size="22" font-weight="700">Inline elements</text>
    <text x="600" y="494" text-anchor="middle" fill="#C5DDE4" font-size="14">emphasis · strong · stem · ruby · media · references · variables</text>
  </g>
  <g stroke="#8A9AAB" stroke-width="2">
    <line x1="600" y1="166" x2="600" y2="192"/>
    <line x1="600" y1="282" x2="600" y2="308"/>
    <line x1="600" y1="398" x2="600" y2="424"/>
  </g>
  <g text-anchor="middle" font-size="14" fill="#8A9AAB">
    <text x="180" y="300">Change models:</text>
    <text x="180" y="322">insert · delete · move</text>
    <text x="180" y="344">modify — collaborative</text>
    <text x="180" y="366">patches on any node</text>
    <line x1="255" y1="290" x2="352" y2="330" stroke="#8A9AAB" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="1020" y="300">Attribute register:</text>
    <text x="1020" y="322">open key-value entries</text>
    <text x="1020" y="344">on ANY construct —</text>
    <text x="1020" y="366">dialects never fork the model</text>
    <line x1="940" y1="290" x2="848" y2="330" stroke="#8A9AAB" stroke-width="1.5" stroke-dasharray="5 5"/>
  </g>
  <text x="600" y="580" text-anchor="middle" fill="#0A1628" font-size="19" font-weight="700">Strict tiers: nesting within a tier, never across tiers.</text>
  <text x="600" y="608" text-anchor="middle" fill="#243647" font-size="15">That one rule is why every markup maps cleanly — and why rendering is predictable.</text>
</svg>
