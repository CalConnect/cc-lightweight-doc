<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#FFFAF2"/>
  <text x="600" y="48" text-anchor="middle" fill="#2F6F82" font-size="15" letter-spacing="3">TC 154 ALREADY STANDARDIZES THE DOCUMENT’S DATA ELEMENTS</text>
  <text x="600" y="76" text-anchor="middle" fill="#8A9AAB" font-size="14">“Processes, data elements and documents in commerce, industry and administration”</text>
  <g font-size="17" text-anchor="middle" font-weight="600">
    <rect x="100" y="130" width="440" height="96" rx="8" fill="#F3EBE0" stroke="#D4C9B5"/>
    <text x="320" y="172" fill="#0A1628" font-size="20">ISO 8601</text>
    <text x="320" y="200" fill="#243647" font-size="15">when — time and date</text>

    <rect x="660" y="130" width="440" height="96" rx="8" fill="#F3EBE0" stroke="#D4C9B5"/>
    <text x="880" y="172" fill="#0A1628" font-size="20">ISO 6523</text>
    <text x="880" y="200" fill="#243647" font-size="15">who — organization identifiers</text>

    <rect x="100" y="260" width="440" height="96" rx="8" fill="#F3EBE0" stroke="#D4C9B5"/>
    <text x="320" y="302" fill="#0A1628" font-size="20">EDIFACT / e-business frameworks</text>
    <text x="320" y="330" fill="#243647" font-size="15">structured trade data — rich text punted on</text>

    <rect x="660" y="260" width="440" height="96" rx="8" fill="#F3EBE0" stroke="#D4C9B5"/>
    <text x="880" y="302" fill="#0A1628" font-size="20">ISO 690 · ISO 5127 (TC 46)</text>
    <text x="880" y="330" fill="#243647" font-size="15">what is cited — we consume, not duplicate</text>
  </g>
  <rect x="100" y="400" width="1000" height="120" rx="8" fill="#0A1628"/>
  <text x="600" y="444" text-anchor="middle" fill="#B85A2A" font-size="14" letter-spacing="2.5" font-weight="700">THE PIECE TC 154 IS MISSING</text>
  <text x="600" y="478" text-anchor="middle" fill="#FFFAF2" font-size="24" font-weight="700">WHAT THE DOCUMENT SAYS — the rich-text layer</text>
  <text x="600" y="504" text-anchor="middle" fill="#C5DDE4" font-size="15">orders, invoices, contracts, reports, specifications — every business document is lightweight rich text</text>
  <g stroke="#B85A2A" stroke-width="2" stroke-dasharray="6 5" fill="none">
    <line x1="320" y1="226" x2="400" y2="392"/>
    <line x1="880" y1="226" x2="800" y2="392"/>
    <line x1="320" y1="356" x2="430" y2="392"/>
    <line x1="880" y1="356" x2="770" y2="392"/>
  </g>
  <text x="600" y="572" text-anchor="middle" fill="#0A1628" font-size="18" font-weight="700">Time, parties, trade data, citations — standardized. The document carrying them: not yet.</text>
  <text x="600" y="600" text-anchor="middle" fill="#243647" font-size="15">TC 154 is where business documents live as data. This is its missing layer — not TC 46’s, which we build upon.</text>
</svg>
